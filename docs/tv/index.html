<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Workout TV">
<meta name="theme-color" content="#f6f4ef">
<title>Workout TV</title>
<style>
@font-face { font-family: Barlow; font-weight: 500; src: url(fonts/Barlow-500.woff2) format("woff2"); }
@font-face { font-family: Barlow; font-weight: 600; src: url(fonts/Barlow-600.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url(fonts/BarlowCondensed-600.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(fonts/BarlowCondensed-700.woff2) format("woff2"); }
:root {
  --bg: #0b0c0e; --panel: #15171a; --panel-2: #1c1f23; --line: #272b30; --text: #f4f4f1; --muted: #9ba1a8;
  --accent: #f5b83d; --accent-ink: #1a1305; --warn: #ef7b63; --ok: #7fcf95; --scrim: rgba(5, 6, 8, .86);
  /* One unit that follows the screen, so a mirrored phone and a TV look the same. */
  --u: min(1vw, 1.78vh);
  --pad: calc(var(--u) * 3);
  --gap: calc(var(--u) * 2.4);
  --radius: calc(var(--u) * .25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font-family: Barlow, system-ui, sans-serif; font-weight: 500; line-height: 1.3; font-size: calc(var(--u) * 2);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.label { font-family: "Barlow Condensed", sans-serif; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); font-size: calc(var(--u) * 1.5); }
.digits { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 1.8);
  padding: calc(var(--u) * 2) var(--pad) calc(var(--u) * 1.8);
  padding-left: max(var(--pad), env(safe-area-inset-left)); padding-right: max(var(--pad), env(safe-area-inset-right)); }
main { flex: 1; min-height: 0; display: flex; }

/* Header: day, clock, sound, and one progress segment per slide */
header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: calc(var(--u) * 1) calc(var(--u) * 2); }
header .where { min-width: 0; display: flex; align-items: baseline; gap: calc(var(--u) * 1.4); white-space: nowrap; overflow: hidden; }
header .where b { color: var(--text); }
header .where .step { color: var(--muted); font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: calc(var(--u) * 2); letter-spacing: 0; text-transform: none; }
header .tools { display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
.clockchip { display: inline-flex; align-items: center; gap: calc(var(--u) * .6); font-size: calc(var(--u) * 2.2); color: var(--text); }
.clockchip svg { color: var(--muted); }
.iconbtn { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4);
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--muted); }
.iconbtn svg { width: 55%; height: 55%; }
.steps-bar { grid-column: 1 / -1; display: flex; gap: calc(var(--u) * .45); }
.steps-bar button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u) * .45); align-items: stretch; text-align: left; padding-top: 2px; }
.steps-bar i { display: block; height: calc(var(--u) * .5); background: var(--line); }
.steps-bar .done i { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.steps-bar .now i { background: var(--accent); }
.steps-bar span { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: calc(var(--u) * 1.35); letter-spacing: .06em; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps-bar .now span { color: var(--text); }

/* Footer controls */
nav { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: calc(var(--u) * 1.2); }
nav .hint { color: var(--muted); font-size: calc(var(--u) * 1.6); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * .8); min-height: 44px; white-space: nowrap;
  font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: calc(var(--u) * 2.3); letter-spacing: .01em;
  padding: calc(var(--u) * .8) calc(var(--u) * 2); border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); }
.btn.ghost { background: none; color: var(--muted); }
.btn:disabled { opacity: .3; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
nav .btn.primary { justify-self: end; max-width: min(100%, calc(var(--u) * 52)); }
.btn.primary span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.btn small { font-family: Barlow, sans-serif; font-weight: 600; font-size: .62em; opacity: .75; text-transform: uppercase; letter-spacing: .06em; }
.btn:focus-visible, .iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
svg.i { width: 1em; height: 1em; flex: none; }

/* Text that shrinks to fit its box (see fit() below) */
.fit { overflow: hidden; min-height: 0; }

/* Home: pick a day */
.home { width: 100%; }
.home.fit { display: flex; flex-direction: column; justify-content: center; gap: 1.1em; font-size: calc(var(--u) * 2); }
.brand { display: flex; align-items: center; gap: .6em; }
.brand .mark { display: grid; place-items: center; width: 1.7em; height: 1.7em; background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); }
.brand .mark svg { width: 70%; height: 70%; }
.home h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 3em; line-height: 1; }
.home .label { font-size: .75em; }
.resume { display: flex; align-items: center; gap: 1em; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: var(--radius); padding: .7em 1em; }
.resume p { flex: 1; min-width: 12em; }
.resume p b { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 1.3em; }
.resume .btn { font-size: 1.05em; }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(16em, 1fr)); gap: 1em; align-items: stretch; }
.day { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1em 1.3em 1.2em; display: flex; flex-direction: column; gap: .7em; min-width: 0; }
.day.up { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.day:active, .day:focus-visible { border-color: var(--accent); outline: none; }
.day .top { min-height: 1.6em; display: flex; align-items: center; justify-content: space-between; gap: 1em; }
.day .pill { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: .8em; letter-spacing: .08em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink); padding: .1em .55em; border-radius: calc(var(--u) * .15); }
.day .last { color: var(--muted); font-size: .8em; }
.day b { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 1.9em; line-height: 1.05;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.day ol { list-style: none; display: grid; gap: .15em; font-size: .92em; border-top: 1px solid var(--line); padding-top: .6em; }
.day ol li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: .4em; align-items: baseline; }
.day ol li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day ol li .k { font-family: "Barlow Condensed", sans-serif; font-weight: 700; color: var(--muted); }
.day ol li .d { font-family: "Barlow Condensed", sans-serif; font-weight: 600; color: var(--muted); }
.day .meta { display: flex; gap: 1.2em; color: var(--muted); font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: .95em; margin-top: auto; }
.day .meta b { font-size: 1em; color: var(--text); display: inline; }
.home .hint { color: var(--muted); font-size: .85em; }

/* Warm-up, finisher and done: content on the left, a big clock on the right */
.timed { display: grid; grid-template-columns: minmax(0, 58fr) minmax(0, 42fr); gap: calc(var(--u) * 3); width: 100%; }
.timed > .fit:not(.clock) { display: flex; flex-direction: column; justify-content: center; gap: .8em; font-size: calc(var(--u) * 2.5); }
.timed h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 2.2em; line-height: 1.02; text-wrap: balance; }
.timed .sub { color: var(--muted); font-size: .85em; max-width: 36em; }
.checks { list-style: none; display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--rows), auto); gap: .35em 1.6em; justify-content: start; }
.checks li { min-width: 0; }
.checks button { width: 100%; display: grid; grid-template-columns: 1.3em minmax(0, 1fr) auto; gap: .6em; align-items: center; text-align: left;
  padding: .32em .5em .32em .2em; border-radius: var(--radius); }
.checks .box { width: 1.15em; height: 1.15em; border: 2px solid var(--muted); border-radius: 50%; display: grid; place-items: center; }
.checks .box svg { width: 75%; height: 75%; opacity: 0; }
.checks .done .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.checks .done .box svg { opacity: 1; }
.checks .done .t { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.checks .run { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.checks .chip { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: .8em; border: 1px solid var(--line); background: var(--panel);
  padding: .05em .55em; border-radius: calc(var(--u) * .15); display: inline-flex; gap: .3em; align-items: center; font-variant-numeric: tabular-nums; }
.checks .run .chip { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.clock { font-size: var(--u); align-self: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2em;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 3em 2.4em; min-height: 0; max-height: 100%; text-align: center; }
.clock > * { flex: none; }
.clock .label { font-size: 1.8em; }
.clock .big { font-size: 15em; line-height: .9; }
.clock .name { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 3.4em; line-height: 1; min-height: 1em; text-transform: uppercase; letter-spacing: .03em; }
.clock .of { color: var(--muted); font-size: 1.8em; }
.clock .btn { font-size: 2.3em; }
.meter { width: 100%; height: calc(var(--u) * .7); background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.clock .row { display: flex; gap: 1em; flex-wrap: wrap; justify-content: center; }
.clock.hot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.clock.hot .label, .clock.hot .of { color: inherit; opacity: .75; }
.clock.hot .meter { background: color-mix(in srgb, var(--accent-ink) 25%, var(--accent)); }
.clock.hot .meter i { background: var(--accent-ink); }
.clock.hot .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.clock.hot .btn.primary { background: var(--bg); color: var(--text); border-color: var(--bg); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); }
.stats div { padding: .6em .9em; }
.stats div + div { border-left: 1px solid var(--line); }
.stats .digits { display: block; font-size: 2em; line-height: 1.05; }

/* Exercise slide. Default layout puts the video big on the left and coaching on the right. */
.ex { display: grid; width: 100%; gap: calc(var(--u) * 1.3) calc(var(--u) * 2.6);
  grid-template-columns: minmax(0, 60fr) minmax(0, 40fr); grid-template-rows: auto auto minmax(0, 1fr);
  grid-template-areas: "stage dose" "stage track" "stage teach"; }
.stage { grid-area: stage; display: flex; flex-direction: column; gap: calc(var(--u) * .8); min-height: 0; }
.video { position: relative; flex: 1; min-height: 0; background: #000; border-radius: var(--radius); overflow: hidden; }
.video iframe, .video > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.video .pic { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: var(--panel); color: var(--text); padding: 4% 6% 3%; }
.video .pic svg { width: 100%; height: 100%; }
.video .pic p { text-align: center; color: var(--muted); font-size: calc(var(--u) * 1.6); }
.video .none { position: absolute; inset: 0; display: grid; place-content: center; gap: calc(var(--u) * .6); text-align: center; padding: 8%; background: var(--panel); color: var(--muted); }
.video .none b { color: var(--text); font-family: "Barlow Condensed", sans-serif; font-size: calc(var(--u) * 2.8); }
.mbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 1.4); min-width: 0; }
.credit { color: var(--muted); font-size: calc(var(--u) * 1.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.seg { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.seg button { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: calc(var(--u) * 1.6); letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); padding: 0 calc(var(--u) * 1.2); min-height: max(32px, calc(var(--u) * 3.4)); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

.dose { grid-area: dose; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.dose div { padding: calc(var(--u) * .7) calc(var(--u) * 1.3); min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: calc(var(--u) * .7); }
.dose div + div { border-left: 1px solid var(--line); }
.dose .num { flex: none; font-family: "Barlow Condensed", sans-serif; font-weight: 700; color: var(--text); font-size: calc(var(--u) * 3.1); line-height: 1.05;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dose .num small { font-size: .55em; font-weight: 600; margin-left: .15em; }
.dose .label { min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.track { grid-area: track; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: calc(var(--u) * 1.4);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: calc(var(--u) * 1.1) calc(var(--u) * 1.3); min-width: 0; }
.track .dots { display: flex; gap: calc(var(--u) * .6); margin-top: calc(var(--u) * .5); }
.track .dots button { width: max(24px, calc(var(--u) * 2.6)); height: max(24px, calc(var(--u) * 2.6)); border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: calc(var(--u) * 1.5); color: var(--muted); }
.track .dots .on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.track .what { min-width: 0; display: flex; flex-direction: column; }
.track .what b { font-family: "Barlow Condensed", sans-serif; font-size: calc(var(--u) * 2.6); line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track .btn { font-size: calc(var(--u) * 2.6); padding: calc(var(--u) * 1.1) calc(var(--u) * 2.2); }

.notes { flex: none; display: grid; gap: calc(var(--u) * .7); min-width: 0; }
.note { display: flex; gap: calc(var(--u) * 1); align-items: flex-start; color: var(--muted); font-size: calc(var(--u) * 1.75); }
.note b { color: var(--text); font-weight: 600; }
.tag { flex: none; font-family: "Barlow Condensed", sans-serif; font-weight: 700; color: var(--accent-ink); background: var(--accent);
  border-radius: calc(var(--u) * .15); padding: 0 calc(var(--u) * .6); font-size: calc(var(--u) * 1.6); line-height: 1.5; }

.teach.fit { grid-area: teach; display: flex; flex-direction: column; gap: .75em; font-size: calc(var(--u) * 2.4); }
.teach h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 1.9em; line-height: 1; text-wrap: balance; overflow-wrap: anywhere;
  display: flex; align-items: flex-start; gap: .35em; }
.teach h1 .slot { flex: none; font-size: .55em; line-height: 1; padding: .2em .35em; margin-top: .14em; background: var(--text); color: var(--bg); border-radius: calc(var(--u) * .15); }
.teach .label { font-size: .62em; margin-bottom: .3em; display: block; }
.teach .setup { color: var(--muted); font-size: .86em; }
.teach .setup ul { list-style: none; display: grid; gap: .15em; color: var(--text); }
.teach .setup li { display: flex; gap: .5em; }
.teach .setup li::before { content: "–"; color: var(--muted); }
.how { list-style: none; counter-reset: s; display: grid; gap: .5em; }
.how li { counter-increment: s; display: grid; grid-template-columns: 1.6em 1fr; gap: .55em; line-height: 1.25; overflow-wrap: anywhere; }
.how li::before { content: counter(s); font-family: "Barlow Condensed", sans-serif; font-weight: 700; color: var(--accent-ink); background: var(--accent);
  width: 1.4em; height: 1.4em; border-radius: 50%; display: grid; place-items: center; font-size: .82em; margin-top: .08em; }
.avoid { background: color-mix(in srgb, var(--warn) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line));
  border-radius: var(--radius); padding: .55em .8em; font-size: .9em; }
.avoid .label { color: var(--warn); }

/* Long coaching text: video, sets and the set tracker share the left; coaching gets the whole right side */
.ex.tight { grid-template-columns: minmax(0, 48fr) minmax(0, 52fr) !important; grid-template-rows: minmax(0, 1fr) auto auto !important;
  grid-template-areas: "stage teach" "dose teach" "track teach" !important; }

/* Rest overlay */
#rest { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; background: var(--scrim); padding: var(--pad); }
#rest.on { display: grid; }
#rest .card { width: min(100%, calc(var(--u) * 78)); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
  padding: calc(var(--u) * 3) calc(var(--u) * 4); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.4); text-align: center; }
#rest .big { font-size: calc(var(--u) * 22); line-height: .85; }
#rest .nextup { font-size: calc(var(--u) * 2.4); color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rest .nextup b { color: var(--text); font-family: "Barlow Condensed", sans-serif; font-size: 1.2em; }
#rest .row { display: flex; gap: calc(var(--u) * 1.2); }
#toast { position: fixed; left: 50%; top: calc(var(--u) * 1.4); transform: translateX(-50%); z-index: 11; background: var(--text); color: var(--bg);
  font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: calc(var(--u) * 2.4); padding: calc(var(--u) * .6) calc(var(--u) * 2);
  border-radius: var(--radius); opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; }

/* ---------- Looks: ?style= takes print (colours) and/or cinema or scoreboard (layout); the default is print + cinema ---------- */

/* Print: light paper and black ink, like the printed sheets */
body[data-style~="print"] { --bg: #f6f4ef; --panel: #ffffff; --panel-2: #ece9e2; --line: #d8d4cb; --text: #141414; --muted: #615d56;
  --accent: #141414; --accent-ink: #ffffff; --warn: #b4321f; --ok: #2f6b40; --scrim: rgba(246, 244, 239, .9); }
body[data-style~="print"] .avoid { background: #fff; border: 2px solid var(--warn); }
body[data-style~="print"] .teach h1, body[data-style~="print"] .home h1 { text-transform: uppercase; letter-spacing: .01em; }
body[data-style~="print"] .teach h1 { border-bottom: 3px solid var(--text); padding-bottom: .14em; }
body[data-style~="print"] #rest .card { border: 2px solid var(--text); }

/* Gym (no layout given): the original split with a 16:9 video and the sets under it */
body:not([data-style~="cinema"]):not([data-style~="scoreboard"]) .ex { grid-template-columns: minmax(0, 53fr) minmax(0, 47fr); }
body:not([data-style~="cinema"]):not([data-style~="scoreboard"]) .video { flex: 0 1 auto; aspect-ratio: 16 / 9; }

/* Cinema without paper colours: black */
body[data-style~="cinema"]:not([data-style~="print"]) { --bg: #000; --panel: #121417; --line: #24282d; --accent: #4fe3c1; --accent-ink: #04201a; }

/* Scoreboard: huge sets, reps and rest across the top; video and steps below */
body[data-style~="scoreboard"] { --bg: #0d1220; --panel: #151c2e; --panel-2: #1b2338; --line: #26304a; --muted: #93a0bd; --accent: #ff5d3a; --accent-ink: #fff; }

/* Short screens (a phone on its side): slimmer header and footer, so the slide gets the room */
@media (orientation: landscape) and (max-height: 560px) {

}

.rotate { display: none; }
@media (orientation: portrait) {

}

/* ---------- Countdown timer that survives a slow phone: it runs off the clock, not off ticks ---------- */
class Countdown {
  constructor(seconds, onTick, onDone) { this.total = seconds * 1000; this.left = this.total; this.running = false; this.onTick = onTick; this.onDone = onDone; this.last = null; }
  remaining() { return this.running ? Math.max(0, this.end - Date.now()) : this.left; }
  start() { if (this.running || this.left <= 0) return; this.running = true; this.end = Date.now() + this.left; this.t = setInterval(() => this.tick(), 100); this.tick(); }
  pause() { if (!this.running) return; this.left = this.remaining(); this.running = false; clearInterval(this.t); this.onTick(this); }
  toggle() { this.running ? this.pause() : this.start(); }
  add(s) { if (this.running) this.end += s * 1000; else this.left = Math.max(0, this.left + s * 1000); this.total = Math.max(1000, this.total + s * 1000); this.tick(); }
  kill() { this.running = false; clearInterval(this.t); }
  tick() {
    const r = this.remaining(), sec = Math.ceil(r / 1000);
    if (this.running && sec !== this.last && sec > 0 && sec <= 3) beep(660, .12);
    this.last = sec;
    this.onTick(this);
    if (this.running && r <= 0) { this.kill(); this.left = 0; beep(880, .45); this.onDone && this.onDone(); }
  }

  const tv = (ex.video && ex.video.tv) || {}, out = [];

  if (tv.backup && tv.backup.youtube_id && tv.backup.status !== "bad") out.push({...clipOf(tv.backup), label: out.length ? "Backup" : "Demo"});
  if (tv.image) out.push({kind: "img", src: tv.image, label: "Photo"});
  if (tv.pictogram && PICTO[tv.pictogram]) out.push({kind: "pic", name: tv.pictogram, label: "Drawing"});
  if (!out.length) out.push({kind: "none", label: "Steps"});
  return out;
}

let ytReady = null, player = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise((res, rej) => {
    if (window.YT && YT.Player) return res(YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); res(YT); };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => rej(new Error("YouTube blocked"));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error("YouTube slow")), 9000);
  });
  return ytReady;
}
const clipLabel = c => `${mmss(c.start * 1000)}–${isFinite(c.end) ? mmss(c.end * 1000) : "end"}`;
function mountMedia(box, ex, n, onFail) {
  const list = sources(ex), m = list[Math.min(n, list.length - 1)];
  if (player && player.destroy) { try { player.destroy(); } catch (e) {} } player = null;
  if (m.kind === "img") { box.innerHTML = `<img src="${esc(m.src)}" alt="${esc(ex.name)}: how it looks">`; return m; }
  if (m.kind === "pic") { box.innerHTML = `<div class="pic">${PICTO[m.name]}<p>1 Start&ensp;→&ensp;2 Finish</p></div>`; return m; }
  if (m.kind === "none") { box.innerHTML = `<div class="none"><b>No demo yet</b><span>Follow the steps on the right.</span></div>`; return m; }
  box.innerHTML = `<div></div>`;
  const host = box.firstChild;
  // Muted autoplay is the only autoplay iOS allows; tap the player for sound. The clip loops between start and end.
  const plain = () => {
    const end = isFinite(m.end) ? `&end=${Math.round(m.end)}` : "";
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(m.id)}?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&start=${Math.round(m.start)}${end}&loop=1&playlist=${encodeURIComponent(m.id)}" title="${esc(ex.name)} demo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  };
  loadYT().then(YT => {
    if (!host.isConnected) return;
    const vars = {autoplay: 1, mute: 1, playsinline: 1, rel: 0, modestbranding: 1, start: Math.round(m.start)};
    if (isFinite(m.end)) vars.end = Math.round(m.end);
    player = new YT.Player(host, {host: "https://www.youtube-nocookie.com", videoId: m.id, playerVars: vars, events: {
      onReady: e => { e.target.mute(); e.target.playVideo(); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) e.target.loadVideoById({videoId: m.id, startSeconds: m.start, endSeconds: isFinite(m.end) ? m.end : undefined}); },
      onError: () => onFail(),
    }});
  }).catch(() => { if (host.isConnected) plain(); });
  return m;
}

/* ---------- Workout state ---------- */
let day = null, i = 0, slides = [];
let session = null; // {day, i, sets: {slide: n}, warm: {item: true}, media: {exerciseId: n}, started}

function buildSlides(key) {
  const d = DATA.plan.days[key], list = [];
  if (d.warmup && d.warmup.length) list.push({kind: "warmup", d, short: "Warm"});
  // Blocks: a superset pair or a single exercise. Letters follow the printed sheet: A1, A2, B1, B2, C.
  const blocks = [];
  d.exercises.forEach((e, n) => {
    const b = e.pair && blocks.find(b => b.pair === e.pair);
    if (b) b.items.push({e, n}); else blocks.push({pair: e.pair || null, items: [{e, n}]});
  });
  blocks.forEach((b, bn) => {
    const letter = String.fromCharCode(65 + bn), idx = [];
    b.items.forEach(({e, n}, k) => {
      const slot = b.items.length > 1 ? letter + (k + 1) : letter;
      idx.push(list.length);
      list.push({kind: "ex", e, n, ex: DATA.exercises[e.id] || {name: e.id}, slot, short: slot, group: idx});
    });
  });
  if (d.finisher && d.finisher.text) list.push({kind: "finisher", d, short: "Finish"});
  list.push({kind: "done", d, short: "Done"});
  return list;
}

const save = () => { if (session) { session.i = i; store.set("session", session); } };

function start(key, resume) {
  day = key; slides = buildSlides(key);
  const old = store.get("session", null);
  session = resume && old && old.day === key ? old : {day: key, i: 0, sets: {}, warm: {}, media: {}, started: Date.now()};
  i = Math.min(session.i || 0, slides.length - 1);
  save(); keepAwake(); render();
}
function goTo(n) {
  closeRest();
  n = Math.max(0, Math.min(slides.length - 1, n));
  if (n === i) { updateTrack(); return; }
  i = n; save(); render();
}
function go(g) {
  if (g === "home") { closeRest(); day = null; render(); return; }
  if (g === "finish") { store.set("last", {day, at: Date.now()}); store.del("session"); session = null; closeRest(); day = null; render(); return; }
  goTo(i + Number(g));
}

/* ---------- Sets and rest ---------- */
function setsDone(n) { return (session.sets[n] || 0); }
function setDone() {
  const s = slides[i];
  if (!s || s.kind !== "ex") return;
  const total = s.e.sets || 1;
  if (setsDone(i) >= total && blockDone(s)) { goTo(s.group[s.group.length - 1] + 1); return; }
  session.sets[i] = Math.min(total, setsDone(i) + 1); save(); updateTrack();
  const pos = s.group.indexOf(i);
  if (pos < s.group.length - 1) {
    // Superset: straight to the partner, no rest.
    const nx = slides[s.group[pos + 1]];
    toast(`Now ${nx.slot}: ${nx.ex.name}`);
    goTo(s.group[pos + 1]);
    return;
  }
  const first = s.group[0], left = (slides[first].e.sets || 1) - setsDone(first);
  const target = left > 0 ? first : s.group[s.group.length - 1] + 1;
  const nx = slides[target];
  const label = left > 0 ? `${nx.slot} ${esc(nx.ex.name)} · set ${setsDone(first) + 1} of ${nx.e.sets}`
    : nx.kind === "ex" ? `${nx.slot} ${esc(nx.ex.name)}` : nx.kind === "finisher" ? "Finisher" : "Wrap up";
  openRest(s.e.rest || 60, label, () => goTo(target));
}
const blockDone = s => s.group.every(n => setsDone(n) >= (slides[n].e.sets || 1));

let restTimer = null;
function openRest(seconds, nextLabel, then) {
  closeRest();
  restEl.innerHTML = `<div class="card">
      <span class="label">Rest</span>
      <span class="big digits" id="rest-t">${mmss(seconds * 1000)}</span>
      <div class="meter"><i id="rest-m"></i></div>
      <p class="nextup">Up next: <b>${nextLabel}</b></p>
      <div class="row">
        <button class="btn" data-r="-15">−15 s</button><button class="btn" data-r="15">+15 s</button>
        <button class="btn primary" data-r="skip">Go now${ICON.right}</button>
      </div></div>`;
  restEl.classList.add("on");
  const t = document.getElementById("rest-t"), m = document.getElementById("rest-m");
  restTimer = new Countdown(seconds, c => { t.textContent = mmss(c.remaining()); m.style.width = `${(1 - c.remaining() / c.total) * 100}%`; }, then);
  restEl.querySelectorAll("button").forEach(b => b.onclick = () => b.dataset.r === "skip" ? then() : restTimer.add(+b.dataset.r));
  restTimer.start();
}
function closeRest() { if (restTimer) restTimer.kill(); restTimer = null; restEl.classList.remove("on"); restEl.innerHTML = ""; }

let toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), 1800); }

/* ---------- Slides ---------- */
function trackHTML(s) {
  const total = s.e.sets || 1, done = setsDone(i);
  const dots = Array.from({length: total}, (_, k) => `<button class="${k < done ? "on" : ""}" data-dot="${k}" aria-label="Set ${k + 1}">${k + 1}</button>`).join("");
  const pos = s.group.indexOf(i), partner = pos < s.group.length - 1 ? slides[s.group[pos + 1]] : null;
  let what, sub, btn;
  if (done >= total && blockDone(s)) { what = "All sets done"; sub = "Move on when you're ready"; btn = `Next${ICON.right}`; }
  else if (done >= total) { what = "Sets done here"; sub = "Finish the other half of the superset"; btn = `Set done${ICON.check}`; }
  else {
    what = `Set ${done + 1} of ${total}`;
    sub = partner ? `Then straight to ${partner.slot}, no rest` : `Then rest ${s.e.rest || 60} s`;
    btn = `Set done${ICON.check}`;
  }
  return `<div class="what" title="${sub}"><b>${what}</b><div class="dots">${dots}</div></div><button class="btn primary" data-set>${btn}</button>`;
}
function updateTrack() {
  const el = app.querySelector(".track");
  if (!el) return;
  el.innerHTML = trackHTML(slides[i]);
  el.querySelector("[data-set]").onclick = setDone;
  el.querySelectorAll("[data-dot]").forEach(b => b.onclick = () => {
    const k = +b.dataset.dot; session.sets[i] = setsDone(i) === k + 1 ? k : k + 1; save(); updateTrack(); markSteps();
  });
  markSteps();
}

function exerciseHTML(s) {
  const {e, ex} = s;
  const cues = ex.cues || [];
  const parts = String(ex.setup || "").split(/\s*·\s*/).filter(Boolean).map(cap);
  const setup = parts.length ? `<div class="setup"><span class="label">Setup</span><ul>${parts.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : "";
  const avoid = ex.x ? `<div class="avoid"><span class="label">Watch for</span>${esc(ex.x)}</div>` : "";
  const how = cues.length ? `<div><span class="label">How to</span><ol class="how">${cues.map(c => `<li><span>${esc(c)}</span></li>`).join("")}</ol></div>` : "";
  const dose = [
    e.sets ? `<div><span class="num">${e.sets}</span><span class="label">sets</span></div>` : "",
    e.reps !== undefined ? `<div><span class="num">${esc(range(e.reps))}</span><span class="label">${unit(ex)}</span></div>` : "",
    e.rest ? `<div><span class="num">${rest(e.rest)}</span><span class="label">rest</span></div>` : "",
  ].join("");
  const partners = s.group.filter(n => n !== i).map(n => slides[n]);
  const tip = e.extra ? `<p class="note"><span class="tag">Tip</span><span>${esc(cap(e.extra))}</span></p>` : "";
  const pair = partners.length
    ? `<p class="note"><span class="tag">Superset</span><span>One set of this, then <b>${partners.map(p => `${p.slot} ${esc(p.ex.name)}`).join("</b>, then <b>")}</b>. ${partners.length > 1 ? "Rest after the round" : "Rest after the pair"}.</span></p>` : "";
  const list = sources(ex), cur = Math.min(session.media[e.id] || 0, list.length - 1);
  const seg = list.length > 1 ? `<div class="seg" role="group" aria-label="Demo type">${list.map((m, k) => `<button data-media="${k}" aria-pressed="${k === cur}">${m.label}</button>`).join("")}</div>` : "";
  return `<section class="ex">
    <div class="stage"><div class="video" id="media"></div><div class="mbar"><span class="credit" id="credit"></span>${seg}</div>
      ${tip || pair ? `<div class="notes">${pair}${tip}</div>` : ""}</div>
    ${dose ? `<div class="dose">${dose}</div>` : ""}
    <div class="track">${trackHTML(s)}</div>
    <div class="teach fit" data-base="2.4">
      <h1><span class="slot">${esc(s.slot)}</span><span>${esc(ex.name)}</span></h1>
      ${setup}${how}${avoid}
    </div></section>`;
}
function showMedia(n) {
  const s = slides[i], box = document.getElementById("media");
  if (!box) return;
  const list = sources(s.ex);
  n = Math.min(n, list.length - 1);
  session.media[s.e.id] = n; save();
  app.querySelectorAll("[data-media]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.media === n)));
  const m = mountMedia(box, s.ex, n, () => { if (n + 1 < list.length) { toast("That video won't play here. Switching."); showMedia(n + 1); } });
  const credit = document.getElementById("credit");
  credit.textContent = m.kind === "yt" ? `${m.src} · clip ${clipLabel(m)}`
    : m.kind === "pic" ? "Drawing: start, then finish" : m.kind === "img" ? "Photo" : "";
}

// Warm-up: tick moves off; anything with a time ("3 min", "20 s") gets its own timer.
const secondsIn = t => { const m = /(\d+)\s*(min|minutes?|s|sec|seconds?)\b/i.exec(t); return m ? +m[1] * (/^m/i.test(m[2]) ? 60 : 1) : 0; };
function warmupHTML(s) {
  const items = s.d.warmup, rows = items.length > 6 ? Math.ceil(items.length / 2) : items.length;
  const done = items.filter((_, k) => session.warm[k]).length;
  return `<section class="timed"><div class="fit" data-base="2.5">
      <div class="rotate">Turn your phone sideways for the TV.</div>
      <span class="label">Warm-up · ${done} of ${items.length} done</span>
      <h1>Get warm: about ${s.d.warmup_min || 8} minutes</h1>
      <ol class="checks" style="--rows:${rows}">${items.map((w, k) => {
        const sec = secondsIn(w);
        return `<li><button data-w="${k}" class="${session.warm[k] ? "done" : ""}"><span class="box">${ICON.check}</span><span class="t">${esc(w)}</span>${sec ? `<span class="chip" id="chip${k}">${ICON.play}${mmss(sec * 1000)}</span>` : ""}</button></li>`;
      }).join("")}</ol>
      <p class="sub">Tap a move when it's done. Tap a timed move to start its timer. Easy pace: loose, not tired.</p></div>
    <div class="clock fit" id="clock" data-base="1"><span class="label" id="c-l">Warm-up clock</span><span class="big digits" id="c-t">0:00</span>
      <span class="name" id="c-n">&nbsp;</span><div class="meter"><i id="c-m"></i></div><span class="of" id="c-o">Target ${s.d.warmup_min || 8}:00</span></div></section>`;
}
function wireWarmup(s) {
  const t0 = Date.now(), target = (s.d.warmup_min || 8) * 60000;
  let active = null, activeK = -1;
  const T = id => document.getElementById(id);
  const idle = setInterval(() => {
    if (active) return;
    const el = Date.now() - t0;
    T("c-t").textContent = mmss(el); T("c-m").style.width = `${Math.min(100, el / target * 100)}%`;
  }, 250);
  slideTimers.push({kill: () => clearInterval(idle)});
  const mark = (k, on) => {
    session.warm[k] = on; save();
    app.querySelector(`[data-w="${k}"]`).classList.toggle("done", on);
    const n = s.d.warmup.filter((_, j) => session.warm[j]).length;
    app.querySelector(".timed .label").textContent = `Warm-up · ${n} of ${s.d.warmup.length} done`;
  };
  app.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
    const k = +b.dataset.w, sec = secondsIn(s.d.warmup[k]);
    if (sec && !session.warm[k]) {
      if (activeK === k) { active.toggle(); return; }
      if (active) { active.kill(); app.querySelector(`[data-w="${activeK}"]`).classList.remove("run"); }
      activeK = k; b.classList.add("run");
      T("c-l").textContent = "Now"; T("c-n").textContent = s.d.warmup[k];
      active = new Countdown(sec, c => {
        const r = mmss(c.remaining());
        T("c-t").textContent = r; T("c-m").style.width = `${(1 - c.remaining() / c.total) * 100}%`;
        T("c-o").textContent = c.running ? "Tap the move to pause" : "Paused · tap the move to go on";
        const chip = T("chip" + k); if (chip) chip.innerHTML = (c.running ? ICON.pause : ICON.play) + r;
      }, () => {
        mark(k, true); b.classList.remove("run"); active = null; activeK = -1;
        T("c-l").textContent = "Warm-up clock"; T("c-n").innerHTML = "&nbsp;"; T("c-o").textContent = `Target ${s.d.warmup_min || 8}:00`;
      });
      slideTimers.push(active);
      active.start();
      return;
    }
    mark(k, !session.warm[k]);
  });
}

// Finisher: "6 × (30 s strong / 30 s easy)" becomes an interval timer; "10 min" becomes a countdown.
function finisherPhases(text) {
  const iv = /(\d+)\s*[×x]\s*\(\s*(\d+)\s*s(?:ec)?\s*([^/]*?)\s*\/\s*(\d+)\s*s(?:ec)?\s*([^)]*?)\s*\)/i.exec(text);
  if (iv) {
    const out = [];
    for (let r = 1; r <= +iv[1]; r++) {
      out.push({s: +iv[2], name: iv[3] || "Work", hot: true, round: r, of: +iv[1]});
      out.push({s: +iv[4], name: iv[5] || "Easy", hot: false, round: r, of: +iv[1]});
    }
    return out;
  }
  const sec = secondsIn(text);
  return sec ? [{s: sec, name: "Steady", hot: false, round: 1, of: 1}] : [];
}
function finisherHTML(s) {
  const ph = finisherPhases(s.d.finisher.text);
  const clock = ph.length ? `<div class="clock fit" id="clock" data-base="1"><span class="label" id="c-l">${ph[0].of > 1 ? `Round 1 of ${ph[0].of}` : "Finisher"}</span>
      <span class="big digits" id="c-t">${mmss(ph[0].s * 1000)}</span><span class="name" id="c-n">${esc(ph[0].name)}</span>
      <div class="meter"><i id="c-m"></i></div><span class="of" id="c-o">Total ${mmss(ph.reduce((a, p) => a + p.s, 0) * 1000)}</span>
      <div class="row"><button class="btn primary" id="c-go">${ICON.play}Start</button><button class="btn" id="c-re">Reset</button></div></div>` : "";
  return `<section class="timed"${ph.length ? "" : ' style="grid-template-columns:1fr"'}><div class="fit" data-base="2.5">
    <span class="label">Finisher</span>
    <h1>${esc(s.d.finisher.text)}</h1>
    ${s.d.finisher.detail ? `<p class="sub">${esc(cap(s.d.finisher.detail))}</p>` : ""}
    <p class="sub">The timer beeps 3, 2, 1 before each change.</p></div>${clock}</section>`;
}
function wireFinisher(s) {
  const ph = finisherPhases(s.d.finisher.text);
  if (!ph.length) return;
  const T = id => document.getElementById(id);
  let k = 0, cd = null;
  const paint = c => {
    const p = ph[k];
    T("clock").classList.toggle("hot", p.hot && c.running);
    T("c-l").textContent = p.of > 1 ? `Round ${p.round} of ${p.of}` : "Finisher";
    T("c-n").textContent = p.name; T("c-t").textContent = mmss(c.remaining());
    T("c-m").style.width = `${(1 - c.remaining() / c.total) * 100}%`;
    T("c-go").innerHTML = c.running ? `${ICON.pause}Pause` : `${ICON.play}${k || c.remaining() < c.total ? "Resume" : "Start"}`;
  };
  const load = (n, run) => {
    if (cd) cd.kill();
    k = n;
    cd = new Countdown(ph[k].s, paint, () => {
      if (k + 1 < ph.length) load(k + 1, true);
      else { T("c-l").textContent = "Done"; T("c-n").textContent = "Nice work"; T("clock").classList.remove("hot"); T("c-go").innerHTML = `${ICON.check}Done`; }
    });
    slideTimers.push(cd);
    run ? cd.start() : paint(cd);
  };
  load(0, false);
  T("c-go").onclick = () => cd.toggle();
  T("c-re").onclick = () => load(0, false);
  slideTimers.push({kill: () => {}, toggle: () => cd.toggle()});
}

function doneHTML(s) {
  const exs = slides.filter(x => x.kind === "ex");
  const sets = exs.reduce((a, x) => a + Math.min(x.e.sets || 1, setsDone(slides.indexOf(x))), 0), planned = exs.reduce((a, x) => a + (x.e.sets || 1), 0);
  const mins = Math.round((Date.now() - session.started) / 60000);
  return `<section class="timed" style="grid-template-columns:1fr"><div class="fit" data-base="2.5">
    <span class="label">${esc(s.d.title)}</span>
    <h1>Workout done. Nice work.</h1>
    <div class="stats"><div><span class="digits">${mins}</span><span class="label">minutes</span></div>
      <div><span class="digits">${sets}/${planned}</span><span class="label">sets ticked</span></div>
      <div><span class="digits">${exs.length}</span><span class="label">exercises</span></div></div>
    <p class="sub">Now write your weights and reps on today's sheet, and take a photo of it when you're done for the week.</p></div></section>`;
}

function slideHTML(s) {
  return s.kind === "ex" ? exerciseHTML(s) : s.kind === "warmup" ? warmupHTML(s) : s.kind === "finisher" ? finisherHTML(s) : doneHTML(s);
}

function homeHTML() {

  return `<main><section class="home fit" data-base="2">

    <h1>Which workout today?</h1>
    ${resume}
    <div class="days">${days.map(([k, d]) => {

      return `<button class="day${k === upNext && !fresh ? " up" : ""}" data-day="${esc(k)}">
        <span class="top">${k === upNext ? '<span class="pill">Up next</span>' : "<span></span>"}${last && last.day === k ? `<span class="last">Last done ${ago(last.at)}</span>` : ""}</span>
        <b>${esc(d.title)}</b>
        <ol>${sl.map(x => `<li><span class="k">${esc(x.slot)}</span><span>${esc(x.ex.name)}</span><span class="d">${x.e.sets ? `${x.e.sets} × ${esc(range(x.e.reps))}` : ""}</span></li>`).join("")}</ol>
        <span class="meta"><span><b>${d.minutes ? `~${d.minutes}` : "–"}</b> min</span><span><b>${sl.length}</b> exercises</span><span><b>${sets}</b> sets</span></span></button>`;
    }).join("")}</div>
    <p class="hint">Tap a workout to start. Swipe or use Next and Back to move. After each set, tap Set done and the rest timer starts. Tap a video for sound.</p></section></main>`;
}

const ICON_SOUND = () => soundOn ? ICON.sound : ICON.mute;
function render() {
  killSlideTimers();
  if (!day) {
    if (player && player.destroy) { try { player.destroy(); } catch (e) {} player = null; }
    app.innerHTML = homeHTML();
    app.querySelectorAll(".day").forEach(b => b.onclick = () => start(b.dataset.day, false));
    app.querySelectorAll("[data-resume]").forEach(b => b.onclick = () => start(b.dataset.resume, true));
    return fitAll();
  }
  const s = slides[i], nxt = slides[i + 1];
  const exs = slides.filter(x => x.kind === "ex");
  const where = s.kind === "ex" ? `Exercise ${exs.indexOf(s) + 1} of ${exs.length}` : s.kind === "warmup" ? "Warm-up" : s.kind === "finisher" ? "Finisher" : "Done";
  const nextLabel = !nxt ? "" : nxt.kind === "ex" ? `${nxt.slot} ${nxt.ex.name}` : nxt.kind === "finisher" ? "Finisher" : "Wrap up";
  const hint = s.kind === "ex" ? "Breathe out on the hard part · stop each set with 1–2 reps left" : s.kind === "warmup" ? "Space bar or tap: tick a move" : "";
  app.innerHTML = `<header>
      <span class="label where"><b>${esc(DATA.plan.days[day].title)}</b><span class="step">${where}</span></span>
      <span class="tools"><span class="clockchip digits" title="Workout time">${ICON.clock}<span id="elapsed">${mmss(Date.now() - session.started)}</span></span>
        <button class="iconbtn" id="snd" aria-label="Sound ${soundOn ? "on" : "off"}">${ICON_SOUND()}</button></span>
      <div class="steps-bar">${slides.map((x, n) => `<button data-jump="${n}" aria-label="Go to ${esc(x.short)}"><i></i><span>${esc(x.short)}</span></button>`).join("")}</div>
    </header>
    <main>${slideHTML(s)}</main>
    <nav>
      <button class="btn ghost" data-go="home" aria-label="All workouts">${ICON.grid}Days</button>
      <button class="btn" data-go="-1" ${i === 0 ? "disabled" : ""}>${ICON.left}Back</button>
      <span class="hint">${hint}</span>
      <button class="btn primary" data-go="${nxt ? 1 : "finish"}">${nxt ? `<small>Next</small><span>${esc(nextLabel)}</span>${ICON.right}` : `<span>Finish</span>${ICON.check}`}</button>
    </nav>`;
  app.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.go));
  app.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => goTo(+b.dataset.jump));
  document.getElementById("snd").onclick = ev => { soundOn = !soundOn; store.set("sound", soundOn); ev.currentTarget.innerHTML = ICON_SOUND(); if (soundOn) { unlockAudio(); beep(); } };
  markSteps();
  if (s.kind === "ex") {
    updateTrack();
    app.querySelectorAll("[data-media]").forEach(b => b.onclick = () => showMedia(+b.dataset.media));
    showMedia(session.media[s.e.id] || 0);
  }
  if (s.kind === "warmup") wireWarmup(s);
  if (s.kind === "finisher") wireFinisher(s);
  fitAll();
}
function markSteps() {
  app.querySelectorAll("[data-jump]").forEach(b => {
    const n = +b.dataset.jump, x = slides[n];
    const complete = x.kind === "ex" ? setsDone(n) >= (x.e.sets || 1) : n < i;
    b.className = n === i ? "now" : complete ? "done" : "";
  });
}
setInterval(() => { const el = document.getElementById("elapsed"); if (el && session) el.textContent = mmss(Date.now() - session.started); }, 1000);

// Shrink a text block until it fits its box, so long names and instructions never spill off the TV.
// If the coaching still doesn't fit, give it more of the screen and try again.
function fitAll() {
  const ex = app.querySelector(".ex");
  if (ex) ex.classList.remove("tight");
  fitBoxes();
  const teach = app.querySelector(".teach");
  if (ex && teach && teach.scrollHeight > teach.clientHeight + 1) { ex.classList.add("tight"); fitBoxes(); }
}
function fitBoxes() {
  if (matchMedia("(orientation: portrait)").matches) {
    app.querySelectorAll(".fit").forEach(el => el.style.fontSize = "");
    return;
  }
  app.querySelectorAll(".fit").forEach(el => {
    const base = parseFloat(el.dataset.base) || 2.4;
    let k = 1;
    el.style.fontSize = `calc(var(--u) * ${base})`;
    while (el.scrollHeight > el.clientHeight + 1 && k > 0.42) {
      k -= 0.04;
      el.style.fontSize = `calc(var(--u) * ${(base * k).toFixed(3)})`;
    }
    // Still too long at the smallest size: let it scroll rather than cut words off.
    el.style.overflowY = el.scrollHeight > el.clientHeight + 1 ? "auto" : "hidden";
  });
}

document.addEventListener("keydown", ev => {
  if (!day) return;
  if (restTimer && (ev.key === " " || ev.key === "Enter")) { ev.preventDefault(); restEl.querySelector('[data-r="skip"]').click(); return; }
  if (ev.key === "ArrowRight" || ev.key === "PageDown") go("1");
  if (ev.key === "ArrowLeft" || ev.key === "PageUp") go("-1");
  if (ev.key === "Escape") restTimer ? closeRest() : go("home");
  if (ev.key === " ") {
    ev.preventDefault();
    const s = slides[i];
    if (s.kind === "ex") setDone();
    else if (s.kind === "finisher") { const c = document.getElementById("c-go"); c && c.click(); }
    else if (s.kind === "warmup") { const b = [...app.querySelectorAll("[data-w]")].find(b => !b.classList.contains("done")); b && b.click(); }
  }
});
let x0 = null, y0 = null;
document.addEventListener("touchstart", ev => { x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; }, {passive: true});
document.addEventListener("touchend", ev => {
  if (!day || x0 === null || restTimer) return;
  const dx = ev.changedTouches[0].clientX - x0, dy = ev.changedTouches[0].clientY - y0; x0 = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? "1" : "-1");
});
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitAll, 120); });

// Keep the phone screen on while mirroring (Safari 16.4+); harmless if not supported.
let lock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && day) keepAwake(); });

render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
</script>
</body></html>
